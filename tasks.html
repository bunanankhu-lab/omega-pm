<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานค้าง · โอเมก้าอีสาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* โทเคนดีไซน์ — "ครีม-แดงโอเมก้า" ชุดเดียวกับ index.html */
  :root {
    --bg: #faf6f4;
    --card: #ffffff;
    --surface: #f1e9e6;
    --text: #1c1818;
    --muted: #827674;
    --border: #E3D9D6;
    --panel: #2e2929;
    --primary: #d2262b;
    --primary-soft: #fff0ee;
    --red: #b91f26;
    --red-bg: #ffdcd8;
    --yellow: #8f1218;
    --yellow-bg: #ffe9e6;
    --green: #4f5361;
    --green-bg: #e1e3ea;
    --radius: 20px;
    --shadow: 0 10px 30px rgba(46,41,41,.14);
    --shadow-sm: 0 1px 2px rgba(46,41,41,.12);
    --shadow-md: 0 3px 10px rgba(46,41,41,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: "IBM Plex Sans Thai", "Segoe UI", Tahoma, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .btn, .fab, .tab, .sum .n { font-family: "Kanit", "IBM Plex Sans Thai", sans-serif; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .ic {
    width: 1.05em; height: 1.05em; stroke: currentColor; fill: none;
    stroke-width: 2.75; stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.14em; display: inline-block; flex: none;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 14px 14px 120px; }

  /* ส่วนหัว */
  header.top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand img { width: 42px; height: 42px; border-radius: 12px; object-fit: contain; background: #fff; border: 1px solid var(--border); }
  .b-name { display: block; font-family: "Kanit", sans-serif; font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
  .b-sub { display: block; font-size: .74rem; color: var(--muted); }
  .back-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 8px 13px; font-family: "Kanit", sans-serif; font-size: .88rem;
    cursor: pointer; text-decoration: none; box-shadow: var(--shadow-sm); white-space: nowrap;
  }
  .back-btn:active { background: var(--primary-soft); }

  /* แถบสถานะคลาวด์ + คนจด */
  .cloud-bar {
    display: flex; align-items: center; gap: 8px; margin: 10px 0 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 8px 12px; box-shadow: var(--shadow-sm); font-size: .82rem;
  }
  .cloud-bar .st { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cloud-bar .st.ok { color: var(--green); }
  .cloud-bar .st.err { color: var(--red); }
  .cloud-bar button {
    border: none; background: none; color: var(--primary); font-family: inherit;
    font-size: .82rem; font-weight: 600; cursor: pointer; padding: 4px 6px; border-radius: 8px;
  }
  .cloud-bar button:active { background: var(--primary-soft); }
  .who { display: flex; align-items: center; gap: 6px; }
  .who label { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .who select {
    max-width: 130px; border: 1px solid var(--border); border-radius: 10px; padding: 5px 8px;
    font-family: inherit; font-size: .84rem; background: var(--bg); color: var(--text);
  }

  /* กล่องสรุป */
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .sum {
    border: none; border-radius: 16px; padding: 10px 6px 8px; text-align: center; cursor: pointer;
    box-shadow: var(--shadow-sm); font-family: inherit;
  }
  .sum .n { font-size: 1.5rem; font-weight: 600; line-height: 1.15; }
  .sum .l { font-size: .74rem; font-weight: 500; }
  .sum.pending { background: var(--yellow-bg); color: var(--yellow); }
  .sum.urgent { background: var(--red-bg); color: var(--red); }
  .sum.done { background: var(--green-bg); color: var(--green); }

  /* แท็บ ค้างอยู่ / เสร็จแล้ว */
  .tabs {
    display: flex; background: var(--surface); border-radius: 14px; padding: 4px; margin-bottom: 12px;
  }
  .tab {
    flex: 1; border: none; background: none; border-radius: 11px; padding: 8px 4px;
    font-size: .92rem; font-weight: 500; color: var(--muted); cursor: pointer;
  }
  .tab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

  /* การ์ดงาน */
  .task {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
  }
  .task.overdue { border-color: #f5837f; background: #fffafa; }
  .chk {
    flex: none; width: 30px; height: 30px; margin-top: 2px; border-radius: 50%;
    border: 2.5px solid var(--border); background: var(--bg); cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: transparent; padding: 0;
  }
  .chk:active { transform: scale(.92); }
  .chk.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chk .ic { width: 16px; height: 16px; stroke-width: 3.5; }
  .task .body { flex: 1; min-width: 0; cursor: pointer; }
  .task .t { font-weight: 600; font-size: .98rem; line-height: 1.4; word-break: break-word; }
  .task.is-done .t { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .task .d { font-size: .84rem; color: var(--muted); white-space: pre-line; word-break: break-word; margin-top: 2px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
    padding: 2px 9px; font-size: .74rem; font-weight: 600; background: var(--surface); color: var(--muted);
  }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.pink { background: var(--yellow-bg); color: var(--yellow); }
  .badge.slate { background: var(--green-bg); color: var(--green); }
  .task .meta { font-size: .72rem; color: var(--muted); margin-top: 7px; }
  .empty {
    text-align: center; color: var(--muted); padding: 44px 16px; font-size: .92rem;
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty .big { font-size: 2rem; margin-bottom: 6px; }

  /* ปุ่มเพิ่มงานลอยล่าง */
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 50;
    border: none; border-radius: 999px; background: var(--primary); color: #fff;
    font-size: 1.02rem; font-weight: 600; padding: 14px 30px; cursor: pointer;
    box-shadow: 0 10px 26px rgba(210,38,43,.4); display: flex; align-items: center; gap: 8px;
  }
  .fab:active { transform: translateX(-50%) scale(.97); }

  /* โมดัลฟอร์ม */
  #modal {
    position: fixed; inset: 0; z-index: 100; background: rgba(46,41,41,.5);
    display: flex; align-items: flex-end; justify-content: center;
  }
  #modal[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--card); border-radius: 24px 24px 0 0; padding: 18px 18px 26px;
    box-shadow: var(--shadow);
  }
  .sheet h2 { margin: 0 0 14px; font-size: 1.15rem; display: flex; align-items: center; justify-content: space-between; }
  .sheet h2 .x { border: none; background: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); padding: 4px 8px; }
  .fld { margin-bottom: 13px; }
  .fld label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .fld input[type="text"], .fld input[type="date"], .fld textarea, .fld select {
    width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px;
    font-family: inherit; font-size: .95rem; background: var(--bg); color: var(--text);
  }
  .fld textarea { min-height: 72px; resize: vertical; }
  .chips { display: flex; gap: 8px; }
  .chip {
    flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    border-radius: 12px; padding: 10px 6px; font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
  }
  .chip.active.normal { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .chip.active.hot { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .btn {
    width: 100%; border: none; border-radius: 14px; padding: 13px; font-size: 1rem; font-weight: 600;
    cursor: pointer; font-family: "Kanit", sans-serif;
  }
  .btn.primary { background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(210,38,43,.3); }
  .btn.primary:active { transform: scale(.98); }
  .btn.danger { background: none; color: var(--red); border: 1px solid var(--red-bg); margin-top: 10px; }
  .form-err { color: var(--red); font-size: .84rem; min-height: 1.2em; margin: 4px 0 8px; }

  /* ทอสต์ */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; z-index: 200;
    background: var(--panel); color: #fff; border-radius: 12px; padding: 10px 18px;
    font-size: .88rem; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
    transition: opacity .25s; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  @media (min-width: 720px) {
    #modal { align-items: center; padding: 20px; }
    .sheet { border-radius: 24px; }
  }
  @media (hover: hover) and (pointer: fine) {
    .back-btn:hover, .tab:hover { background: var(--primary-soft); }
    .tab.active:hover { background: var(--card); }
    .task .body:hover .t { color: var(--primary); }
    .fab:hover { filter: brightness(1.06); }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>

  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>

<div class="app">
  <header class="top">
    <div class="brand">
      <img src="logo.png" alt="Omega E-Sarn">
      <div>
        <span class="b-name">งานค้าง</span>
        <span class="b-sub">จดงาน · ติ๊กเสร็จ · โอเมก้าอีสาน</span>
      </div>
    </div>
    <a class="back-btn" href="index.html">‹ หน้าหลัก</a>
  </header>

  <div class="cloud-bar">
    <span class="st" id="st">กำลังโหลด...</span>
    <div class="who">
      <label for="whoSel">ผู้จด</label>
      <select id="whoSel"></select>
    </div>
    <button type="button" id="refreshBtn" title="รีเฟรช"><svg class="ic"><use href="#i-refresh"/></svg></button>
  </div>

  <div class="summary">
    <button type="button" class="sum pending" id="sumPending"><div class="n" id="nPending">0</div><div class="l">งานค้าง</div></button>
    <button type="button" class="sum urgent" id="sumUrgent"><div class="n" id="nUrgent">0</div><div class="l">งานด่วน</div></button>
    <button type="button" class="sum done" id="sumDone"><div class="n" id="nDone">0</div><div class="l">เสร็จแล้ว</div></button>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" id="tabPending">ค้างอยู่</button>
    <button type="button" class="tab" id="tabDone">เสร็จแล้ว</button>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty" hidden></div>
</div>

<button type="button" class="fab" id="fabAdd"><svg class="ic"><use href="#i-plus"/></svg> จดงานใหม่</button>

<div id="modal" hidden>
  <div class="sheet">
    <h2><span id="mTitle">จดงานใหม่</span><button type="button" class="x" id="mClose">✕</button></h2>
    <div class="fld">
      <label for="fTitle">ชื่องาน *</label>
      <input type="text" id="fTitle" placeholder="เช่น ไปเก็บเงินร้านป้าแดง / ซ่อมเครื่องซักผ้าสาขา 2" maxlength="200">
    </div>
    <div class="fld">
      <label for="fDetail">รายละเอียด / หมายเหตุ</label>
      <textarea id="fDetail" placeholder="รายละเอียดเพิ่มเติม (ไม่บังคับ)"></textarea>
    </div>
    <div class="fld">
      <label for="fAssignee">ผู้รับผิดชอบ</label>
      <input type="text" id="fAssignee" list="namesDl" placeholder="มอบงานให้ใคร (ไม่บังคับ)" maxlength="60">
      <datalist id="namesDl"></datalist>
    </div>
    <div class="fld">
      <label for="fDue">กำหนดเสร็จ</label>
      <input type="date" id="fDue">
    </div>
    <div class="fld">
      <label>ความเร่งด่วน</label>
      <div class="chips">
        <button type="button" class="chip normal active" id="chipNormal">ปกติ</button>
        <button type="button" class="chip hot" id="chipHot"><svg class="ic"><use href="#i-flame"/></svg> ด่วน</button>
      </div>
    </div>
    <div class="form-err" id="fErr"></div>
    <button type="button" class="btn primary" id="saveBtn">บันทึกงาน</button>
    <button type="button" class="btn danger" id="delBtn" hidden>ลบงานนี้</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  var BASE = "https://vhrexjmzdcvlojzanvum.supabase.co/rest/v1/todo_tasks";
  var KEY = "sb_publishable_47xRsvJMYfqk1XSlW6qjaQ_8ABKblB5";
  var HEADERS = { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" };

  var DEFAULT_NAMES = ["หัวหน้า", "เจ้าของ", "ช่าง"];
  var LS_WHO = "omega_tasks_who";
  var LS_NAMES = "omega_tasks_names";

  var tasks = [];
  var tab = "pending";      // pending | done
  var editId = null;        // null = จดงานใหม่
  var urgent = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  // ---------- วันที่ไทย พ.ศ. ----------
  var TH_M = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function thDate(iso) {
    if (!iso) return "";
    var p = String(iso).slice(0, 10).split("-");
    if (p.length !== 3) return iso;
    return Number(p[2]) + " " + TH_M[Number(p[1]) - 1] + " " + (Number(p[0]) + 543 - 2500);
  }
  function thDateTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.getDate() + " " + TH_M[d.getMonth()] + " " + (d.getFullYear() + 543 - 2500);
  }
  function dayDiff(iso) {
    // กำหนดเสร็จ - วันนี้ (ติดลบ = เลยกำหนดแล้ว)
    var t = new Date(todayStr() + "T00:00:00");
    var d = new Date(String(iso).slice(0, 10) + "T00:00:00");
    return Math.round((d - t) / 86400000);
  }

  // ---------- รายชื่อคนจด / ผู้รับผิดชอบ ----------
  function savedNames() {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(LS_NAMES) || "[]"); } catch (e) {}
    return Array.isArray(arr) ? arr : [];
  }
  function allNames() {
    var set = {};
    var out = [];
    DEFAULT_NAMES.concat(savedNames()).forEach(add);
    tasks.forEach(function (t) { add(t.created_by); add(t.assignee); });
    function add(n) {
      n = String(n || "").trim();
      if (n && n !== "ระบบ" && !set[n]) { set[n] = 1; out.push(n); }
    }
    return out;
  }
  function rememberName(n) {
    n = String(n || "").trim();
    if (!n || DEFAULT_NAMES.indexOf(n) >= 0) return;
    var arr = savedNames();
    if (arr.indexOf(n) < 0) {
      arr.push(n);
      localStorage.setItem(LS_NAMES, JSON.stringify(arr));
    }
  }
  function currentWho() { return localStorage.getItem(LS_WHO) || DEFAULT_NAMES[0]; }

  function renderWho() {
    var names = allNames();
    var who = currentWho();
    if (names.indexOf(who) < 0) names.unshift(who);
    $("whoSel").innerHTML =
      names.map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === who ? " selected" : "") + ">" + esc(n) + "</option>";
      }).join("") + '<option value="__new">＋ เพิ่มชื่อใหม่...</option>';
    $("namesDl").innerHTML = names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join("");
  }

  $("whoSel").addEventListener("change", function () {
    if (this.value === "__new") {
      var n = (window.prompt("พิมพ์ชื่อผู้จดคนใหม่") || "").trim();
      if (n) {
        rememberName(n);
        localStorage.setItem(LS_WHO, n);
      }
      renderWho();
      return;
    }
    localStorage.setItem(LS_WHO, this.value);
  });

  // ---------- โหลด + แสดงผล ----------
  function setStatus(msg, cls) {
    var el = $("st");
    el.textContent = msg;
    el.className = "st" + (cls ? " " + cls : "");
  }

  function load() {
    setStatus("กำลังโหลด...");
    fetch(BASE + "?select=*&order=created_at.desc&limit=500", { headers: HEADERS })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (rows) {
        tasks = rows;
        setStatus("ข้อมูลล่าสุด ✓", "ok");
        renderWho();
        render();
      })
      .catch(function () {
        setStatus("โหลดไม่สำเร็จ — เช็คสัญญาณเน็ตแล้วกดรีเฟรช", "err");
      });
  }

  function render() {
    var pending = tasks.filter(function (t) { return !t.done; });
    var done = tasks.filter(function (t) { return t.done; });
    $("nPending").textContent = pending.length;
    $("nUrgent").textContent = pending.filter(function (t) { return t.urgent; }).length;
    $("nDone").textContent = done.length;

    $("tabPending").textContent = "ค้างอยู่ (" + pending.length + ")";
    $("tabDone").textContent = "เสร็จแล้ว (" + done.length + ")";
    $("tabPending").classList.toggle("active", tab === "pending");
    $("tabDone").classList.toggle("active", tab === "done");

    var list;
    if (tab === "pending") {
      // ด่วนขึ้นก่อน → ใกล้กำหนด/เลยกำหนดขึ้นก่อน (ไม่มีกำหนดไว้ท้าย) → งานเก่าขึ้นก่อน
      list = pending.slice().sort(function (a, b) {
        if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
        var da = a.due_date || "9999-12-31", db = b.due_date || "9999-12-31";
        if (da !== db) return da < db ? -1 : 1;
        return a.created_at < b.created_at ? -1 : 1;
      });
    } else {
      list = done.slice().sort(function (a, b) {
        return (b.done_at || b.created_at) < (a.done_at || a.created_at) ? -1 : 1;
      });
    }

    var empty = $("empty");
    if (!list.length) {
      $("list").innerHTML = "";
      empty.hidden = false;
      empty.innerHTML = tab === "pending"
        ? '<div class="big">🎉</div>ไม่มีงานค้าง เยี่ยมมาก!<br>กดปุ่ม "จดงานใหม่" ด้านล่างเพื่อเพิ่มงาน'
        : '<div class="big">📝</div>ยังไม่มีงานที่ติ๊กเสร็จ';
      return;
    }
    empty.hidden = true;

    $("list").innerHTML = list.map(function (t) {
      var over = !t.done && t.due_date && dayDiff(t.due_date) < 0;
      var badges = "";
      if (t.urgent && !t.done) badges += '<span class="badge red"><svg class="ic"><use href="#i-flame"/></svg> ด่วน</span>';
      if (t.due_date) {
        var diff = dayDiff(t.due_date);
        var txt = thDate(t.due_date);
        var cls = "slate";
        if (!t.done) {
          if (diff < 0) { txt = "เลยกำหนด " + Math.abs(diff) + " วัน (" + txt + ")"; cls = "red"; }
          else if (diff === 0) { txt = "ครบกำหนดวันนี้"; cls = "red"; }
          else if (diff <= 3) { txt = "อีก " + diff + " วัน (" + txt + ")"; cls = "pink"; }
          else { txt = "กำหนด " + txt; }
        } else { txt = "กำหนด " + txt; }
        badges += '<span class="badge ' + cls + '"><svg class="ic"><use href="#i-cal"/></svg> ' + esc(txt) + "</span>";
      }
      if (t.assignee) badges += '<span class="badge slate"><svg class="ic"><use href="#i-user"/></svg> ' + esc(t.assignee) + "</span>";

      var meta = "จดโดย " + esc(t.created_by || "ไม่ระบุ") + " · " + thDateTime(t.created_at);
      if (t.done && t.done_at) meta += " · ✓ เสร็จ " + thDateTime(t.done_at);

      return '<div class="task' + (t.done ? " is-done" : "") + (over ? " overdue" : "") + '" data-id="' + t.id + '">' +
        '<button type="button" class="chk' + (t.done ? " on" : "") + '" data-chk="' + t.id + '" title="ติ๊กเสร็จ/ไม่เสร็จ">' +
        '<svg class="ic"><use href="#i-check"/></svg></button>' +
        '<div class="body" data-edit="' + t.id + '">' +
        '<div class="t">' + esc(t.title) + "</div>" +
        (t.detail ? '<div class="d">' + esc(t.detail) + "</div>" : "") +
        (badges ? '<div class="badges">' + badges + "</div>" : "") +
        '<div class="meta">' + meta + ' · <span style="color:var(--primary);font-weight:600"><svg class="ic" style="width:.9em;height:.9em"><use href="#i-pencil"/></svg> แก้ไข</span></div>' +
        "</div></div>";
    }).join("");
  }

  // ---------- ติ๊กเสร็จ / ไม่เสร็จ ----------
  function toggleDone(id) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    var newDone = !t.done;
    // อัปเดตหน้าจอทันที แล้วค่อยบันทึกขึ้นเว็บ
    t.done = newDone;
    t.done_at = newDone ? new Date().toISOString() : null;
    render();
    fetch(BASE + "?id=eq." + id, {
      method: "PATCH",
      headers: HEADERS,
      body: JSON.stringify({ done: newDone, done_at: t.done_at, updated_at: new Date().toISOString() }),
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      toast(newDone ? "✓ ติ๊กเสร็จแล้ว — " + t.title : "เอางานกลับมาค้างอยู่ — " + t.title);
      if (newDone) notifyDone(t);
    }).catch(function () {
      t.done = !newDone;
      t.done_at = null;
      render();
      toast("บันทึกไม่สำเร็จ — เช็คสัญญาณเน็ตแล้วลองอีกครั้ง");
    });
  }

  // แจ้งเข้ากลุ่ม LINE ว่างานเสร็จ — ยิงหลังบันทึกสำเร็จ พลาดก็แค่ไม่เด้ง ไม่กระทบตัวงาน
  function notifyDone(t) {
    if (location.protocol === "file:") return;
    fetch("api/task-done", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: t.id, by: currentWho() }),
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.sent) toast("✅ ติ๊กเสร็จ + แจ้งเข้ากลุ่ม LINE แล้ว — " + t.title);
      else if (j.error) toast("✓ เสร็จแล้ว แต่แจ้ง LINE ไม่ได้: " + j.error);
    }).catch(function () {});
  }

  // ---------- ฟอร์มจด / แก้ไขงาน ----------
  function setUrgent(v) {
    urgent = v;
    $("chipNormal").classList.toggle("active", !v);
    $("chipHot").classList.toggle("active", v);
  }
  function openForm(id) {
    editId = id || null;
    var t = editId ? tasks.find(function (x) { return x.id === editId; }) : null;
    $("mTitle").textContent = t ? "แก้ไขงาน" : "จดงานใหม่";
    $("fTitle").value = t ? t.title : "";
    $("fDetail").value = t ? t.detail : "";
    $("fAssignee").value = t ? t.assignee : "";
    $("fDue").value = t && t.due_date ? String(t.due_date).slice(0, 10) : "";
    setUrgent(t ? !!t.urgent : false);
    $("delBtn").hidden = !t;
    $("fErr").textContent = "";
    $("modal").hidden = false;
    if (!t) setTimeout(function () { $("fTitle").focus(); }, 60);
  }
  function closeForm() { $("modal").hidden = true; }

  function save() {
    var title = $("fTitle").value.trim();
    if (!title) {
      $("fErr").textContent = "กรุณาใส่ชื่องานก่อนบันทึก";
      $("fTitle").focus();
      return;
    }
    var payload = {
      title: title,
      detail: $("fDetail").value.trim(),
      assignee: $("fAssignee").value.trim(),
      due_date: $("fDue").value || null,
      urgent: urgent,
      updated_at: new Date().toISOString(),
    };
    var btn = $("saveBtn");
    btn.disabled = true;
    btn.textContent = "กำลังบันทึก...";
    var req;
    if (editId) {
      req = fetch(BASE + "?id=eq." + editId, { method: "PATCH", headers: HEADERS, body: JSON.stringify(payload) });
    } else {
      payload.created_by = currentWho();
      req = fetch(BASE, { method: "POST", headers: HEADERS, body: JSON.stringify(payload) });
    }
    req.then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      rememberName(payload.assignee);
      closeForm();
      toast(editId ? "✓ แก้ไขงานแล้ว" : "✓ จดงานใหม่แล้ว");
      load();
    }).catch(function () {
      $("fErr").textContent = "บันทึกไม่สำเร็จ — เช็คสัญญาณเน็ตแล้วกดบันทึกอีกครั้ง";
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = "บันทึกงาน";
    });
  }

  function del() {
    var t = tasks.find(function (x) { return x.id === editId; });
    if (!t) return;
    if (!window.confirm('ลบงาน "' + t.title + '" ทิ้งถาวร?')) return;
    fetch(BASE + "?id=eq." + editId, { method: "DELETE", headers: HEADERS })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        closeForm();
        toast("ลบงานแล้ว");
        load();
      })
      .catch(function () {
        $("fErr").textContent = "ลบไม่สำเร็จ — เช็คสัญญาณเน็ตแล้วลองอีกครั้ง";
      });
  }

  // ---------- ผูกอีเวนต์ ----------
  $("list").addEventListener("click", function (e) {
    var chk = e.target.closest("[data-chk]");
    if (chk) { toggleDone(Number(chk.getAttribute("data-chk"))); return; }
    var body = e.target.closest("[data-edit]");
    if (body) openForm(Number(body.getAttribute("data-edit")));
  });
  $("fabAdd").addEventListener("click", function () { openForm(null); });
  $("mClose").addEventListener("click", closeForm);
  $("modal").addEventListener("click", function (e) { if (e.target === this) closeForm(); });
  $("saveBtn").addEventListener("click", save);
  $("delBtn").addEventListener("click", del);
  $("chipNormal").addEventListener("click", function () { setUrgent(false); });
  $("chipHot").addEventListener("click", function () { setUrgent(true); });
  $("refreshBtn").addEventListener("click", load);
  $("tabPending").addEventListener("click", function () { tab = "pending"; render(); });
  $("tabDone").addEventListener("click", function () { tab = "done"; render(); });
  $("sumPending").addEventListener("click", function () { tab = "pending"; render(); });
  $("sumUrgent").addEventListener("click", function () { tab = "pending"; render(); });
  $("sumDone").addEventListener("click", function () { tab = "done"; render(); });
  $("fTitle").addEventListener("keydown", function (e) { if (e.key === "Enter") save(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("modal").hidden) closeForm(); });
  // เปิดแอปค้างไว้แล้วสลับกลับมา → โหลดข้อมูลล่าสุด (เผื่อหัวหน้าเพิ่งจดงานใหม่จากเครื่องอื่น)
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });

  renderWho();
  load();
})();
</script>
</body>
</html>
