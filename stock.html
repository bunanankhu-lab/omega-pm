<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สต๊อกวัสดุ-อะไหล่ · บริษัทโอเมก้าอีสาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ============ โทเคนดีไซน์ — ชุดเดียวกับแอปหลัก "แผงควบคุมเครื่อง + ป้ายตรวจเช็ค" ============ */
  :root {
    --bg: #EEF3F5;            /* ขาวพอร์ซเลน */
    --card: #ffffff;
    --text: #142833;          /* น้ำเงินหมึก */
    --muted: #5D7480;
    --border: #D7E1E6;
    --panel: #0E2C3A;         /* แผงเข้ม */
    --panel-2: #123647;
    --ice: #8FD4EA;           /* ฟ้าน้ำแข็ง — สีเน้นบนพื้นเข้ม */
    --primary: #1D6786;
    --primary-soft: #E2EEF3;
    --red: #B93A2B;
    --red-bg: #F9E9E6;
    --red-b: #FF9282;
    --yellow: #92600C;
    --yellow-bg: #F9F0DB;
    --yellow-b: #FFC670;
    --green: #2E7D4F;
    --green-bg: #E6F3EC;
    --green-b: #7BD6A1;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(14,44,58,.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: "IBM Plex Sans Thai", "Segoe UI", Tahoma, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 0 14px 110px; }

  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .top-panel :focus-visible, #loginPage :focus-visible { outline-color: var(--ice); }

  #loginPage {
    position: fixed; inset: 0; z-index: 999;
    background: radial-gradient(120% 90% at 50% 0%, var(--panel-2) 0%, #0B222D 72%);
    display: flex; align-items: center; justify-content: center; padding: 24px; color: #fff;
  }
  #loginPage[hidden] { display: none; }
  .login-box { width: 100%; max-width: 320px; text-align: center; }
  .login-box .big-icon {
    width: 76px; height: 76px; margin: 0 auto 16px; font-size: 34px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: rgba(143,212,234,.08); border: 1px solid rgba(143,212,234,.35);
  }
  .login-box h2 { margin: 0 0 4px; color: #fff; font-size: 1.4rem; font-weight: 600; }
  .login-box .sub { color: rgba(255,255,255,.55); font-size: .88rem; margin: 0 0 18px; }
  .login-box input {
    width: 100%; text-align: center; font-size: 1.6rem; letter-spacing: 10px;
    padding: 12px 10px; border: 1.5px solid rgba(255,255,255,.2); border-radius: 12px;
    background: rgba(255,255,255,.07); color: #fff; outline: none;
    font-family: inherit; font-variant-numeric: tabular-nums;
  }
  .login-box input:focus { border-color: var(--ice); }
  #loginPage .btn.primary { background: var(--ice); color: #0B222D; font-weight: 700; box-shadow: none; margin-top: 14px; }
  .login-box .err { color: var(--red-b); font-size: .85rem; min-height: 1.3em; margin-top: 10px; }

  /* ============ แผงหัวเข้มแบบแอปหลัก ============ */
  .top-panel {
    margin: 0 -14px 14px; padding: 18px 18px 16px;
    background: linear-gradient(178deg, #0C2530 0%, var(--panel) 55%, var(--panel-2) 100%);
    border-radius: 0 0 22px 22px; color: #fff;
  }
  @media (prefers-reduced-motion: no-preference) {
    .top-panel { animation: panelIn .45s cubic-bezier(.22,1,.36,1) both; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; margin-bottom: 10px; flex-wrap: wrap; }
  header.top h1 { font-size: 1.28rem; margin: 0; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
  .pill-link {
    font-size: .8rem; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.1); padding: 7px 13px; border-radius: 999px; font-family: inherit; cursor: pointer;
  }
  .pill-link:active { background: rgba(255,255,255,.24); }

  .cloud-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: .78rem; color: rgba(255,255,255,.55); margin: 0 0 12px; padding: 0 2px;
  }
  .cloud-bar .st.ok { color: var(--green-b); }
  .cloud-bar .st.err { color: var(--red-b); }
  .cloud-bar button {
    flex-shrink: 0; border: none; background: rgba(255,255,255,.12); color: #fff;
    border-radius: 999px; padding: 6px 12px; font-family: inherit; font-size: .76rem; font-weight: 600; cursor: pointer;
  }
  .cloud-bar button:active { background: rgba(255,255,255,.26); }

  /* แถบสรุป 3 ช่อง — หน้าปัดแบบแอปหลัก */
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 2px; }
  .sum-box {
    border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 10px 6px 8px; text-align: center;
    cursor: pointer; transition: transform .1s, border-color .15s, background-color .15s;
    background: rgba(255,255,255,.06); font-family: inherit; color: #fff;
  }
  .sum-box:active { transform: scale(.97); }
  .sum-box .n { font-size: 1.7rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .sum-box .l { font-size: .7rem; color: rgba(255,255,255,.55); }
  .sum-box.red .n { color: var(--red-b); font-weight: 700; }
  .sum-box.red .l { color: rgba(255,255,255,.75); }
  .sum-box.yellow .n { color: var(--yellow-b); }
  .sum-box.green .n { color: var(--green-b); }
  .sum-box.red.active { border-color: var(--red-b); background: rgba(255,146,130,.14); }
  .sum-box.yellow.active { border-color: var(--yellow-b); background: rgba(255,198,112,.14); }
  .sum-box.green.active { border-color: var(--green-b); background: rgba(123,214,161,.14); }

  .line-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 11px 14px; font-family: inherit;
    font-size: .88rem; font-weight: 600; margin-bottom: 12px; transition: transform .1s;
  }
  .line-bar:active { transform: scale(.985); }
  .line-bar .arr { color: var(--primary); font-weight: 600; font-size: .8rem; flex-shrink: 0; }

  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap input {
    width: 100%; padding: 12px 14px 12px 40px; border: 1px solid var(--border); border-radius: 12px;
    font-family: inherit; font-size: .95rem; background: var(--card); color: var(--text);
  }
  .search-wrap input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,103,134,.12); }
  .search-wrap .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; padding-bottom: 2px; margin-bottom: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 5px 11px; font-family: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
  }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .tab-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 12px;
    padding: 9px 6px; font-family: inherit; font-size: .88rem; font-weight: 600; cursor: pointer;
  }
  .tab-btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

  .grp-head { font-size: .85rem; font-weight: 600; color: var(--primary); margin: 14px 4px 8px; display: flex; justify-content: space-between; }
  .grp-head .c { color: var(--muted); font-weight: 500; }

  .item-card {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--green);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .item-card.low { border-left-color: var(--yellow); }
  .item-card.out { border-left-color: var(--red); }
  .item-main { flex: 1; min-width: 0; cursor: pointer; }
  .item-main .nm { font-weight: 600; font-size: .92rem; line-height: 1.35; }
  .item-main .nt { font-size: .74rem; color: var(--muted); }
  .item-main .st { font-size: .72rem; font-weight: 700; }
  .item-card.low .st { color: var(--yellow); }
  .item-card.out .st { color: var(--red); }
  .qty-box { text-align: center; flex-shrink: 0; min-width: 52px; }
  .qty-box .q { font-size: 1.25rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .item-card.low .qty-box .q { color: var(--yellow); }
  .item-card.out .qty-box .q { color: var(--red); }
  .qty-box .u { font-size: .68rem; color: var(--muted); }
  .act-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .act-btn {
    border: none; border-radius: 10px; padding: 7px 12px; font-family: inherit;
    font-size: .8rem; font-weight: 700; cursor: pointer; line-height: 1;
  }
  .act-btn.in { background: var(--green-bg); color: var(--green); }
  .act-btn.outb { background: var(--red-bg); color: var(--red); }
  .act-btn:active { opacity: .7; }

  .mv-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: .85rem; }
  .mv-card .t { color: var(--muted); font-size: .72rem; }
  .mv-card .d { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .mv-qty { font-weight: 700; flex-shrink: 0; }
  .mv-qty.in { color: var(--green); }
  .mv-qty.out { color: var(--red); }
  .mv-qty.adjust { color: var(--primary); }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .9rem; }
  .empty .big { font-size: 40px; margin-bottom: 6px; }

  .fab-row {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: linear-gradient(180deg, rgba(238,243,245,0) 0%, var(--bg) 40%);
    padding: 18px 14px 16px;
  }
  .fab-row .inner { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 13px 10px; font-family: inherit;
    font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(46,125,79,.22); }
  .fab-row .btn.primary {
    background: var(--panel); color: #fff; border: 1px solid rgba(143,212,234,.35); border-radius: 999px;
    font-size: 1rem; padding: 15px 10px; box-shadow: 0 10px 24px rgba(14,44,58,.35);
  }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: var(--card); color: var(--red); border: 1px solid var(--red-bg); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .55; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(14,44,58,.55); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-bg[hidden] { display: none; }
  .modal {
    background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 520px;
    max-height: 88vh; overflow-y: auto; padding: 18px 16px 22px;
  }
  .modal h3 { margin: 0 0 2px; font-size: 1.1rem; font-weight: 600; color: var(--text); }
  .modal .sub { color: var(--muted); font-size: .82rem; margin-bottom: 12px; }
  .fld { margin-bottom: 11px; }
  .fld label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .fld input, .fld select, .fld textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 12px;
    font-family: inherit; font-size: .95rem; background: #fff; color: var(--text);
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--primary); }
  .stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; }
  .stepper button {
    border: 1.5px solid var(--border); background: var(--primary-soft); color: var(--primary);
    border-radius: 12px; font-size: 1.3rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .stepper input { text-align: center; font-size: 1.3rem; font-weight: 700; }
  .btn-row2 { display: flex; gap: 8px; margin-top: 14px; }
  .btn-row2[hidden] { display: none; }
  .modal .err { color: var(--red); font-size: .82rem; min-height: 1.2em; margin-top: 8px; text-align: center; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(16px); z-index: 200;
    background: var(--panel); color: #fff; border-radius: 999px; padding: 11px 20px;
    font-size: .88rem; font-weight: 600; box-shadow: 0 8px 24px rgba(11,34,45,.35);
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ เดสก์ท็อป (≥960px) — ใช้งานในคอมเป็นหลัก ============ */
  @media (min-width: 960px) {
    .app { max-width: 1100px; padding: 0 28px 110px; }
    .top-panel { margin: 0 -28px 14px; padding: 22px 30px 18px; border-radius: 0 0 26px 26px; }
    header.top h1 { font-size: 1.45rem; }
    .sum-box { padding: 14px 8px 12px; }
    .sum-box .n { font-size: 2rem; }
    .sum-box .l { font-size: .78rem; }

    #itemList, #histList { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; align-items: start; }
    #itemList .item-card, #histList .mv-card { margin-bottom: 0; }
    #itemList .grp-head, #histList .grp-head { grid-column: 1 / -1; margin: 8px 4px 0; }
    #itemList .empty, #histList .empty { grid-column: 1 / -1; }

    .modal-bg { align-items: center; padding: 24px; }
    .modal { border-radius: 20px; width: min(600px, 100%); max-height: 86vh; padding: 22px 24px 26px; box-shadow: 0 24px 64px rgba(11,34,45,.35); }
    .fab-row .inner { max-width: 360px; }
  }

  /* hover สำหรับเมาส์ (ไม่แตะมือถือ) */
  @media (hover: hover) and (pointer: fine) {
    .item-card, .mv-card { transition: transform .1s, box-shadow .15s; }
    .item-card:hover, .mv-card:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(14,44,58,.1); }
    .line-bar:hover { border-color: var(--primary); }
    .tab-btn:not(.active):hover { background: var(--primary-soft); color: var(--primary); }
    .chip:not(.active):hover { background: var(--primary-soft); color: var(--primary); }
    .btn:hover { filter: brightness(1.06); }
    .pill-link:hover, .cloud-bar button:hover { background: rgba(255,255,255,.22); }
    .sum-box:hover { background: rgba(255,255,255,.12); }
    .act-btn:hover { filter: brightness(.96); }
  }
</style>
</head>
<body>

<div id="loginPage" hidden>
  <div class="login-box">
    <div class="big-icon">🧰</div>
    <h2>สต๊อกวัสดุ-อะไหล่</h2>
    <p class="sub">บริษัทโอเมก้าอีสาน · ใส่รหัสผ่านเพื่อเข้าใช้งาน</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    <button type="button" class="btn primary" id="pinBtn" style="width:100%">เข้าใช้งาน</button>
    <div class="err" id="pinErr" role="alert"></div>
  </div>
</div>

<div class="app" id="appMain" hidden>
  <div class="top-panel">
    <header class="top">
      <h1>🧰 สต๊อกวัสดุ-อะไหล่</h1>
      <span style="display:flex;gap:6px">
        <a class="pill-link" href="index.html">← แอป PM</a>
        <button type="button" class="pill-link" id="logoutBtn" title="ออกจากระบบ" aria-label="ออกจากระบบ">🔒</button>
      </span>
    </header>

    <div class="cloud-bar">
      <span class="st" id="cloudSt">⏳ กำลังโหลด...</span>
      <button type="button" id="refreshBtn">🔄 รีเฟรช</button>
    </div>

    <div class="summary">
      <button type="button" class="sum-box red" data-f="out"><div class="n" id="sumOut">0</div><div class="l">หมด</div></button>
      <button type="button" class="sum-box yellow" data-f="low"><div class="n" id="sumLow">0</div><div class="l">ใกล้หมด</div></button>
      <button type="button" class="sum-box green" data-f="ok"><div class="n" id="sumOk">0</div><div class="l">ปกติ</div></button>
    </div>
  </div>

  <button type="button" class="line-bar" id="lineAlertBar">
    <span>📢 แจ้งของใกล้หมดเข้ากลุ่ม LINE <span style="color:var(--muted);font-weight:500">· Bot Omega</span></span>
    <span class="arr">ส่งเลย ›</span>
  </button>

  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input id="searchInput" placeholder="ค้นหาชื่อวัสดุ-อะไหล่ / S/N...">
  </div>

  <div class="chips" id="catChips"></div>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabItems">📦 รายการของ</button>
    <button type="button" class="tab-btn" id="tabHist">📜 ประวัติรับ-จ่าย</button>
  </div>

  <div id="itemList"></div>
  <div id="histList" hidden></div>
  <div class="empty" id="listEmpty" hidden><div class="big">🔎</div>ไม่พบรายการ</div>
</div>

<div class="fab-row" id="fabRow" hidden>
  <div class="inner">
    <button type="button" class="btn primary" id="addBtn">+ เพิ่มรายการใหม่</button>
  </div>
</div>

<!-- โมดัลรับเข้า / จ่ายออก / ปรับยอด -->
<div class="modal-bg" id="moveBg" hidden>
  <div class="modal">
    <h3 id="mvTitle">รับเข้า</h3>
    <div class="sub" id="mvSub"></div>
    <div class="fld">
      <label id="mvQtyLabel">จำนวน</label>
      <div class="stepper">
        <button type="button" id="mvMinus">−</button>
        <input id="mvQty" type="number" inputmode="numeric" min="0" step="1" value="1">
        <button type="button" id="mvPlus">＋</button>
      </div>
    </div>
    <div class="fld" id="mvDateFld">
      <label>วันที่ทำรายการ <span style="font-weight:400">(เลือกย้อนหลังได้ เผื่อวันนั้นไม่ได้คีย์)</span></label>
      <select id="mvDate"></select>
    </div>
    <div class="fld">
      <label>ผู้ทำรายการ</label>
      <input id="mvPerson" placeholder="ชื่อคนรับ/จ่ายของ">
    </div>
    <div class="fld">
      <label>หมายเหตุ (งาน/ร้านค้า ฯลฯ)</label>
      <input id="mvNote" placeholder="เช่น งานติดตั้งร้าน... / ซื้อเข้าจากร้าน...">
    </div>
    <div class="err" id="mvErr"></div>
    <div class="btn-row2">
      <button type="button" class="btn secondary" id="mvCancel">ยกเลิก</button>
      <button type="button" class="btn primary" id="mvOk">บันทึก</button>
    </div>
  </div>
</div>

<!-- โมดัลเพิ่ม / แก้ไขรายการ -->
<div class="modal-bg" id="editBg" hidden>
  <div class="modal">
    <h3 id="edTitle">เพิ่มรายการใหม่</h3>
    <div class="sub" id="edSub"></div>
    <div class="fld"><label>ชื่อรายการ</label><input id="edName"></div>
    <div class="fld"><label>หมวด</label><select id="edCat"></select></div>
    <div class="fld" id="edSnFld" hidden><label>S/N (หมายเลขเครื่อง)</label><input id="edSn" placeholder="มีหลายเครื่อง คั่นด้วย , เช่น A123, B456"></div>
    <div class="fld" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <span><label>หน่วย</label><input id="edUnit" value="ตัว"></span>
      <span id="edQtyWrap"><label>คงเหลือ</label><input id="edQty" type="number" inputmode="numeric" min="0" value="0"></span>
      <span><label>ขั้นต่ำ (เตือน)</label><input id="edMin" type="number" inputmode="numeric" min="0" value="2"></span>
    </div>
    <div class="fld" id="edDateFld">
      <label>วันที่รับของเข้า <span style="font-weight:400">(เลือกย้อนหลังได้)</span></label>
      <select id="edDate"></select>
    </div>
    <div class="fld"><label>ผู้ทำรายการ</label><input id="edPerson" placeholder="ชื่อคนเพิ่ม/รับของเข้า"></div>
    <div class="fld"><label>หมายเหตุ</label><input id="edNote"></div>
    <div class="err" id="edErr"></div>
    <div class="btn-row2">
      <button type="button" class="btn secondary" id="edCancel">ยกเลิก</button>
      <button type="button" class="btn primary" id="edOk">บันทึก</button>
    </div>
    <div class="btn-row2" id="edDelRow" hidden>
      <button type="button" class="btn danger" id="edDel">🗑 ลบรายการนี้ (เฉพาะเจ้าของ)</button>
    </div>
  </div>
</div>

<!-- โมดัลแก้ไข/ลบรายการประวัติ -->
<div class="modal-bg" id="fixBg" hidden>
  <div class="modal">
    <h3 id="fxTitle">แก้ไขประวัติ</h3>
    <div class="sub" id="fxSub"></div>
    <div class="fld">
      <label id="fxQtyLabel">จำนวน</label>
      <div class="stepper">
        <button type="button" id="fxMinus">−</button>
        <input id="fxQty" type="number" inputmode="numeric" min="0" step="1">
        <button type="button" id="fxPlus">＋</button>
      </div>
    </div>
    <div class="fld"><label>ผู้ทำรายการ</label><input id="fxPerson"></div>
    <div class="fld"><label>หมายเหตุ</label><input id="fxNote"></div>
    <div class="err" id="fxErr"></div>
    <div class="btn-row2">
      <button type="button" class="btn secondary" id="fxCancel">ยกเลิก</button>
      <button type="button" class="btn primary" id="fxOk">บันทึกแก้ไข</button>
    </div>
    <div class="btn-row2" id="fxDelRow">
      <button type="button" class="btn danger" id="fxDel">🗑 ลบรายการนี้ (คืนยอดสต๊อกให้อัตโนมัติ)</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://vhrexjmzdcvlojzanvum.supabase.co";
  var SUPABASE_KEY = "sb_publishable_47xRsvJMYfqk1XSlW6qjaQ_8ABKblB5";
  var TECH_PIN = "2569";
  var BOSS_PIN = "4768";
  var LOGIN_KEY = "omega_pm_login";   // ใช้คีย์เดียวกับแอป PM — ล็อกอินที่เดียวใช้ได้ทั้งคู่
  var PERSON_KEY = "omega_inv_person";

  var CATS = ["อุปกรณ์ท่อ PVC", "อุปกรณ์ท่อไฟฟ้า", "วัสดุ-อุปกรณ์เครื่องล้างจาน", "วัสดุ-อุปกรณ์เครื่องทำน้ำแข็ง", "วัสดุ-อุปกรณ์กรองน้ำ", "น้ำยาล้างจาน", "เครื่องล้างจาน", "เครื่องทำน้ำแข็ง"];
  var CAT_SHORT = { "อุปกรณ์ท่อ PVC": "ท่อ PVC", "อุปกรณ์ท่อไฟฟ้า": "ท่อไฟฟ้า", "วัสดุ-อุปกรณ์เครื่องล้างจาน": "อุปกรณ์ล้างจาน", "วัสดุ-อุปกรณ์เครื่องทำน้ำแข็ง": "อุปกรณ์น้ำแข็ง", "วัสดุ-อุปกรณ์กรองน้ำ": "กรองน้ำ" };
  var SN_CATS = ["เครื่องล้างจาน", "เครื่องทำน้ำแข็ง"]; // หมวดที่มีช่อง S/N (หมายเลขเครื่อง)

  var items = [];
  var moves = [];
  var q = "", cat = "", statusF = "", tab = "items";
  var role = null;

  function $(id) { return document.getElementById(id); }
  function sbHeaders(json) {
    var h = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };
    if (json) h["Content-Type"] = "application/json";
    return h;
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function statusOf(it) {
    var n = Number(it.qty);
    if (n <= 0) return "out";
    if (n <= Number(it.min_qty)) return "low";
    return "ok";
  }
  function fmtQty(n) {
    n = Number(n);
    return (n % 1 === 0) ? String(n) : n.toFixed(1);
  }
  function fmtClock(iso) {
    var d = new Date(iso);
    var mi = d.getMinutes();
    return d.getHours() + ":" + (mi < 10 ? "0" : "") + mi + " น.";
  }
  var TH_DOW = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
  var TH_MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  function dayKey(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  }
  function fmtDay(iso) {
    var d = new Date(iso);
    var now = new Date();
    var base = TH_DOW[d.getDay()] + " " + d.getDate() + " " + TH_MON[d.getMonth()] + " " + ((d.getFullYear() + 543) % 100);
    if (dayKey(iso) === dayKey(now.toISOString())) return "วันนี้ · " + base;
    var yd = new Date(now.getTime() - 86400000);
    if (dayKey(iso) === dayKey(yd.toISOString())) return "เมื่อวาน · " + base;
    return base;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- ล็อกอิน ----------
  function initLogin() {
    var saved = localStorage.getItem(LOGIN_KEY);
    if (saved === "tech" || saved === "boss") { role = saved; showApp(); return; }
    $("loginPage").hidden = false;
    $("pinBtn").addEventListener("click", tryPin);
    $("pinInput").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPin(); });
  }
  function tryPin() {
    var v = $("pinInput").value.trim();
    var r = v === BOSS_PIN ? "boss" : v === TECH_PIN ? "tech" : null;
    if (!r) { $("pinErr").textContent = "รหัสไม่ถูกต้อง"; $("pinInput").value = ""; return; }
    role = r;
    try { localStorage.setItem(LOGIN_KEY, r); } catch (e) {}
    $("loginPage").hidden = true;
    showApp();
  }
  function showApp() {
    $("loginPage").hidden = true;
    $("appMain").hidden = false;
    $("fabRow").hidden = false;
    loadAll();
  }

  // ---------- โหลดข้อมูล ----------
  function loadAll() {
    $("cloudSt").textContent = "⏳ กำลังโหลด...";
    $("cloudSt").className = "st";
    var pItems = fetch(SUPABASE_URL + "/rest/v1/inv_items?active=eq.true&order=sort_order,name&select=*", { headers: sbHeaders() })
      .then(function (r) { if (!r.ok) throw new Error("items " + r.status); return r.json(); })
      .then(function (rows) {
        // เรียงหมวดตามลำดับในไฟล์สต๊อกเดิม (ท่อ PVC → ท่อไฟฟ้า → ล้างจาน → น้ำแข็ง) หมวดใหม่ต่อท้าย
        return rows.sort(function (a, b) {
          var ca = CATS.indexOf(a.category), cb = CATS.indexOf(b.category);
          if (ca === -1) ca = 99; if (cb === -1) cb = 99;
          if (ca !== cb) return ca - cb;
          if (a.category !== b.category) return a.category < b.category ? -1 : 1;
          return (a.sort_order - b.sort_order) || (a.name < b.name ? -1 : 1);
        });
      });
    var pMoves = fetch(SUPABASE_URL + "/rest/v1/inv_moves?select=*,inv_items(name,unit)&order=created_at.desc&limit=150", { headers: sbHeaders() })
      .then(function (r) { if (!r.ok) throw new Error("moves " + r.status); return r.json(); });
    Promise.all([pItems, pMoves]).then(function (res) {
      items = res[0]; moves = res[1];
      $("cloudSt").textContent = "☁️ ข้อมูลกลาง · " + items.length + " รายการ";
      $("cloudSt").className = "st ok";
      render();
    }).catch(function (e) {
      $("cloudSt").textContent = "⚠️ ต่อข้อมูลกลางไม่ได้ — ลองรีเฟรช";
      $("cloudSt").className = "st err";
    });
  }

  // ---------- แสดงผล ----------
  function render() {
    var nOut = 0, nLow = 0, nOk = 0;
    items.forEach(function (it) {
      var s = statusOf(it);
      if (s === "out") nOut++; else if (s === "low") nLow++; else nOk++;
    });
    $("sumOut").textContent = nOut; $("sumLow").textContent = nLow; $("sumOk").textContent = nOk;
    document.querySelectorAll(".sum-box").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-f") === statusF);
    });
    renderChips();
    if (tab === "items") renderItems(); else renderHist();
  }
  function renderChips() {
    var host = $("catChips");
    var html = '<button type="button" class="chip' + (cat === "" ? " active" : "") + '" data-c="">ทั้งหมด</button>';
    CATS.forEach(function (c) {
      html += '<button type="button" class="chip' + (cat === c ? " active" : "") + '" data-c="' + esc(c) + '">' + esc(CAT_SHORT[c] || c) + "</button>";
    });
    host.innerHTML = html;
    host.querySelectorAll(".chip").forEach(function (b) {
      b.addEventListener("click", function () { cat = b.getAttribute("data-c"); render(); });
    });
  }
  function filtered() {
    var qq = q.trim().toLowerCase();
    return items.filter(function (it) {
      if (cat && it.category !== cat) return false;
      if (statusF && statusOf(it) !== statusF) return false;
      if (qq && (it.name + " " + (it.note || "") + " " + (it.sn || "")).toLowerCase().indexOf(qq) === -1) return false;
      return true;
    });
  }
  function renderItems() {
    $("itemList").hidden = false; $("histList").hidden = true;
    var list = filtered();
    $("listEmpty").hidden = list.length > 0;
    var html = "", lastCat = null;
    var catCount = {};
    list.forEach(function (it) { catCount[it.category] = (catCount[it.category] || 0) + 1; });
    list.forEach(function (it) {
      if (it.category !== lastCat) {
        html += '<div class="grp-head"><span>' + esc(it.category) + '</span><span class="c">' + catCount[it.category] + " รายการ</span></div>";
        lastCat = it.category;
      }
      var s = statusOf(it);
      var stTxt = s === "out" ? "⛔ หมด" : s === "low" ? "⚠️ ใกล้หมด" : "";
      html += '<div class="item-card ' + s + '" data-id="' + it.id + '">' +
        '<div class="item-main" data-act="edit">' +
          '<div class="nm">' + esc(it.name) + "</div>" +
          (it.sn ? '<div class="nt">S/N: ' + esc(it.sn) + "</div>" : "") +
          (it.note ? '<div class="nt">' + esc(it.note) + "</div>" : "") +
          (stTxt ? '<div class="st">' + stTxt + "</div>" : "") +
        "</div>" +
        '<div class="qty-box"><div class="q">' + fmtQty(it.qty) + '</div><div class="u">' + esc(it.unit) + "</div></div>" +
        '<div class="act-col">' +
          '<button type="button" class="act-btn in" data-act="in">+ รับ</button>' +
          '<button type="button" class="act-btn outb" data-act="out">− จ่าย</button>' +
        "</div></div>";
    });
    $("itemList").innerHTML = html;
    $("itemList").querySelectorAll("[data-act]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.closest(".item-card").getAttribute("data-id");
        var it = items.find(function (x) { return x.id === id; });
        if (!it) return;
        var act = el.getAttribute("data-act");
        if (act === "edit") openEdit(it); else openMove(it, act);
      });
    });
  }
  function renderHist() {
    $("itemList").hidden = true; $("histList").hidden = false;
    $("listEmpty").hidden = moves.length > 0;
    // จัดกลุ่มเป็นรายวัน (moves เรียงใหม่→เก่าอยู่แล้ว)
    var days = [], byDay = {};
    moves.forEach(function (m) {
      var k = dayKey(m.created_at);
      if (!byDay[k]) { byDay[k] = []; days.push(k); }
      byDay[k].push(m);
    });
    var html = moves.length ? '<div style="text-align:center;color:var(--muted);font-size:.75rem;margin-bottom:8px">💡 ลงข้อมูลผิด? แตะที่รายการเพื่อแก้ไขหรือลบได้</div>' : "";
    days.forEach(function (k) {
      var list = byDay[k];
      var nIn = 0, nOut = 0, nAdj = 0;
      list.forEach(function (m) {
        if (m.type === "in") nIn++; else if (m.type === "out") nOut++; else nAdj++;
      });
      var sum = [];
      if (nIn) sum.push("รับ " + nIn);
      if (nOut) sum.push("จ่าย " + nOut);
      if (nAdj) sum.push("ปรับ " + nAdj);
      html += '<div class="grp-head"><span>📅 ' + fmtDay(list[0].created_at) + '</span><span class="c">' + sum.join(" · ") + "</span></div>";
      list.forEach(function (m) {
        var nm = m.inv_items ? m.inv_items.name : "(รายการถูกลบ)";
        var un = m.inv_items ? m.inv_items.unit : "";
        var sign = m.type === "in" ? "+" : m.type === "out" ? "−" : "→";
        var lbl = m.type === "in" ? "รับเข้า" : m.type === "out" ? "จ่ายออก" : "ปรับยอด";
        html += '<div class="mv-card" data-mid="' + m.id + '" style="cursor:pointer">' +
          '<div class="t">' + fmtClock(m.created_at) + " · " + lbl + (m.person ? " · " + esc(m.person) : "") + "</div>" +
          '<div class="d"><span>' + esc(nm) + "</span>" +
          '<span class="mv-qty ' + m.type + '">' + sign + " " + fmtQty(m.qty) + " " + esc(un) +
          (m.balance_after != null ? ' <span style="color:var(--muted);font-weight:500">(เหลือ ' + fmtQty(m.balance_after) + ")</span>" : "") +
          "</span></div>" +
          (m.note ? '<div class="t">📝 ' + esc(m.note) + "</div>" : "") +
          "</div>";
      });
    });
    $("histList").innerHTML = html || "";
    $("histList").querySelectorAll(".mv-card[data-mid]").forEach(function (el) {
      el.addEventListener("click", function () {
        var m = moves.find(function (x) { return x.id === el.getAttribute("data-mid"); });
        if (m) openFix(m);
      });
    });
  }

  // ---------- แก้ไข / ลบรายการประวัติ ----------
  var fxMove = null;
  function openFix(m) {
    fxMove = m;
    var nm = m.inv_items ? m.inv_items.name : "(รายการถูกลบ)";
    var un = m.inv_items ? m.inv_items.unit : "";
    var lbl = m.type === "in" ? "รับเข้า" : m.type === "out" ? "จ่ายออก" : "ปรับยอด";
    var isAdj = m.type === "adjust";
    $("fxTitle").textContent = "✏️ แก้ไข" + lbl + " — " + nm;
    $("fxSub").textContent = fmtDay(m.created_at) + " " + fmtClock(m.created_at) +
      (isAdj ? " · รายการปรับยอดแก้ตัวเลข/ลบไม่ได้ — ถ้ายอดยังผิด ให้ไปกดปรับยอดใหม่ที่หน้ารายการของ" : "");
    $("fxQtyLabel").textContent = "จำนวน" + (un ? " (" + un + ")" : "");
    $("fxQty").value = fmtQty(m.qty);
    $("fxQty").disabled = isAdj;
    $("fxMinus").disabled = isAdj;
    $("fxPlus").disabled = isAdj;
    $("fxPerson").value = m.person || "";
    $("fxNote").value = m.note || "";
    $("fxErr").textContent = "";
    $("fxDelRow").hidden = isAdj;
    $("fixBg").hidden = false;
  }
  function doFix(del) {
    if (!fxMove) return;
    var lbl = fxMove.type === "in" ? "รับเข้า" : "จ่ายออก";
    if (del && !confirm("ลบรายการ" + lbl + " " + fmtQty(fxMove.qty) + " นี้?\nยอดสต๊อกจะถูกคืน/หักกลับให้ถูกต้องอัตโนมัติ")) return;
    var qty = fxMove.type === "adjust" ? Number(fxMove.qty) : Number($("fxQty").value);
    if (!del && fxMove.type !== "adjust" && (!isFinite(qty) || qty <= 0)) { $("fxErr").textContent = "ใส่จำนวนให้ถูกต้อง"; return; }
    $("fxOk").disabled = true; $("fxDel").disabled = true;
    fetch(SUPABASE_URL + "/rest/v1/rpc/inv_fix_move", {
      method: "POST", headers: sbHeaders(true),
      body: JSON.stringify({ p_move: fxMove.id, p_qty: qty, p_person: $("fxPerson").value.trim(), p_note: $("fxNote").value.trim(), p_delete: !!del }),
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
      return r.json();
    }).then(function () {
      $("fxOk").disabled = false; $("fxDel").disabled = false;
      $("fixBg").hidden = true;
      toast(del ? "🗑 ลบแล้ว — คืนยอดสต๊อกเรียบร้อย" : "✅ แก้ไขแล้ว — ปรับยอดสต๊อกให้ตรงเรียบร้อย");
      loadAll();
    }).catch(function (e) {
      $("fxOk").disabled = false; $("fxDel").disabled = false;
      $("fxErr").textContent = /insufficient/.test(String(e.message))
        ? "แก้แบบนี้จะทำให้ยอดคงเหลือติดลบ — เช็คยอดจริงก่อน"
        : "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง";
    });
  }

  // ---------- รับ / จ่าย / ปรับยอด ----------
  var mvItem = null, mvType = "in";
  function fillDateSelect(sel) {
    var opts = "";
    var now = new Date();
    for (var i = 0; i <= 30; i++) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var iso = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
      var lbl = TH_DOW[d.getDay()] + " " + d.getDate() + " " + TH_MON[d.getMonth()] + " " + ((d.getFullYear() + 543) % 100);
      if (i === 0) lbl = "วันนี้ · " + lbl;
      if (i === 1) lbl = "เมื่อวาน · " + lbl;
      opts += '<option value="' + (i === 0 ? "" : iso) + '">' + lbl + "</option>";
    }
    sel.innerHTML = opts;
    sel.value = "";
  }
  // วันที่ที่เลือก (ค่า "ปี-เดือน-วัน") + เวลา ณ ตอนนี้ → ISO สำหรับ p_at · เลือก "วันนี้" = null
  function pickedAt(sel) {
    var dsel = sel.value;
    if (!dsel) return null;
    var p = dsel.split("-");
    var now = new Date();
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), now.getHours(), now.getMinutes(), now.getSeconds()).toISOString();
  }
  function openMove(it, type) {
    mvItem = it; mvType = type;
    $("mvTitle").textContent = (type === "in" ? "🟢 รับเข้า — " : type === "out" ? "🔴 จ่ายออก — " : "🔧 ปรับยอด — ") + it.name;
    $("mvSub").textContent = "คงเหลือตอนนี้ " + fmtQty(it.qty) + " " + it.unit +
      (type === "adjust" ? " · ใส่ตัวเลขที่นับได้จริง" : "");
    $("mvQtyLabel").textContent = type === "adjust" ? "ยอดคงเหลือใหม่ (นับจริง)" : "จำนวน (" + it.unit + ")";
    $("mvQty").value = type === "adjust" ? fmtQty(it.qty) : "1";
    $("mvDateFld").hidden = type === "adjust"; // ปรับยอดนับจริง = ณ ตอนนี้เท่านั้น
    fillDateSelect($("mvDate"));
    $("mvPerson").value = localStorage.getItem(PERSON_KEY) || "";
    $("mvNote").value = "";
    $("mvErr").textContent = "";
    $("moveBg").hidden = false;
  }
  function doMove() {
    var qty = Number($("mvQty").value);
    if (!isFinite(qty) || qty < 0 || (mvType !== "adjust" && qty <= 0)) { $("mvErr").textContent = "ใส่จำนวนให้ถูกต้อง"; return; }
    if (mvType === "out" && qty > Number(mvItem.qty)) {
      $("mvErr").textContent = "จ่ายเกินยอดคงเหลือ (" + fmtQty(mvItem.qty) + " " + mvItem.unit + ") — ถ้ายอดจริงไม่ตรง ใช้ปุ่มแก้ไข > ปรับยอด";
      return;
    }
    var person = $("mvPerson").value.trim();
    try { localStorage.setItem(PERSON_KEY, person); } catch (e) {}
    var body = { p_item: mvItem.id, p_type: mvType, p_qty: qty, p_person: person, p_note: $("mvNote").value.trim() };
    var at = mvType === "adjust" ? null : pickedAt($("mvDate"));
    if (at) body.p_at = at; // ลงย้อนหลัง: ใช้วันที่ที่เลือก + เวลา ณ ตอนนี้
    $("mvOk").disabled = true;
    fetch(SUPABASE_URL + "/rest/v1/rpc/inv_move", {
      method: "POST", headers: sbHeaders(true),
      body: JSON.stringify(body),
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
      return r.json();
    }).then(function (rows) {
      var updated = rows && rows[0];
      if (updated) {
        var i = items.findIndex(function (x) { return x.id === updated.id; });
        if (i >= 0) items[i] = updated;
      }
      $("moveBg").hidden = true;
      $("mvOk").disabled = false;
      toast((mvType === "in" ? "✅ รับเข้า " : mvType === "out" ? "✅ จ่ายออก " : "✅ ปรับยอด ") + mvItem.name);
      loadAll();
    }).catch(function (e) {
      $("mvOk").disabled = false;
      $("mvErr").textContent = /insufficient/.test(String(e.message)) ? "ของไม่พอจ่าย — ยอดอาจเพิ่งถูกคนอื่นตัดไป ลองรีเฟรช" : "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง";
    });
  }

  // ---------- เพิ่ม / แก้ไข ----------
  var edItem = null;
  function fillCatSelect() {
    var seen = {};
    var all = CATS.slice();
    items.forEach(function (it) { if (all.indexOf(it.category) === -1) all.push(it.category); });
    $("edCat").innerHTML = all.map(function (c) {
      seen[c] = 1;
      return '<option value="' + esc(c) + '">' + esc(c) + "</option>";
    }).join("");
  }
  function openEdit(it) {
    edItem = it || null;
    fillCatSelect();
    $("edTitle").textContent = it ? "✏️ แก้ไขรายการ" : "＋ เพิ่มรายการใหม่";
    $("edSub").textContent = it ? "แตะปรับข้อมูล · เปลี่ยนยอดคงเหลือจะบันทึกเป็น “ปรับยอด” ในประวัติ"
      : "ถ้าใส่ยอดคงเหลือ จะบันทึกเป็น “รับเข้า” ในประวัติตามวันที่ที่เลือก";
    $("edDateFld").hidden = !!it; // เลือกวันที่ได้เฉพาะตอนเพิ่มใหม่ (แก้ยอดทีหลัง = ปรับยอด ณ ตอนนี้)
    if (!it) fillDateSelect($("edDate"));
    $("edName").value = it ? it.name : "";
    $("edCat").value = it ? it.category : (cat || CATS[0]);
    $("edSn").value = it ? (it.sn || "") : "";
    syncSnFld();
    $("edUnit").value = it ? it.unit : "ตัว";
    $("edQty").value = it ? fmtQty(it.qty) : "0";
    $("edMin").value = it ? fmtQty(it.min_qty) : "2";
    $("edPerson").value = localStorage.getItem(PERSON_KEY) || "";
    $("edNote").value = it ? (it.note || "") : "";
    $("edErr").textContent = "";
    $("edDelRow").hidden = !(it && role === "boss");
    $("editBg").hidden = false;
  }
  function syncSnFld() {
    $("edSnFld").hidden = SN_CATS.indexOf($("edCat").value) === -1;
  }
  function saveEdit() {
    var name = $("edName").value.trim();
    if (!name) { $("edErr").textContent = "ใส่ชื่อรายการก่อน"; return; }
    var body = {
      name: name,
      category: $("edCat").value,
      unit: $("edUnit").value.trim() || "ตัว",
      min_qty: Number($("edMin").value) || 0,
      note: $("edNote").value.trim(),
      sn: $("edSn").value.trim(),
    };
    var newQty = Number($("edQty").value) || 0;
    var person = $("edPerson").value.trim();
    try { localStorage.setItem(PERSON_KEY, person); } catch (e) {}
    $("edOk").disabled = true;
    var done = function () {
      $("edOk").disabled = false;
      $("editBg").hidden = true;
      toast("✅ บันทึกแล้ว");
      loadAll();
    };
    var fail = function () { $("edOk").disabled = false; $("edErr").textContent = "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง"; };
    if (!edItem) {
      // สร้างรายการด้วยยอด 0 ก่อน แล้วลงยอดเริ่มต้นเป็น "รับเข้า" ผ่าน inv_move — จะได้มีประวัติ + ระบุวันที่ย้อนหลังได้
      body.qty = 0;
      body.sort_order = 99999; // ต่อท้ายหมวด
      var at = pickedAt($("edDate"));
      var h = sbHeaders(true);
      h.Prefer = "return=representation";
      fetch(SUPABASE_URL + "/rest/v1/inv_items", { method: "POST", headers: h, body: JSON.stringify(body) })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (rows) {
          var created = rows && rows[0];
          if (!created || newQty <= 0) return;
          var mbody = { p_item: created.id, p_type: "in", p_qty: newQty, p_person: person, p_note: "ยอดเริ่มต้นตอนเพิ่มรายการ" };
          if (at) mbody.p_at = at;
          return fetch(SUPABASE_URL + "/rest/v1/rpc/inv_move", { method: "POST", headers: sbHeaders(true), body: JSON.stringify(mbody) })
            .then(function (r) { if (!r.ok) throw "move"; });
        })
        .then(done)
        .catch(function (e) {
          if (e === "move") {
            // รายการถูกสร้างแล้วแต่ลงยอดไม่สำเร็จ — อย่าให้กดบันทึกซ้ำจนได้รายการซ้ำ
            $("edOk").disabled = false;
            $("editBg").hidden = true;
            toast("⚠️ เพิ่มรายการแล้ว แต่ลงยอดรับเข้าไม่สำเร็จ — กดปุ่ม + รับ ที่รายการนั้นอีกครั้ง");
            loadAll();
          } else fail();
        });
    } else {
      fetch(SUPABASE_URL + "/rest/v1/inv_items?id=eq." + edItem.id, { method: "PATCH", headers: sbHeaders(true), body: JSON.stringify(body) })
        .then(function (r) {
          if (!r.ok) throw 0;
          // ถ้ายอดถูกแก้ → บันทึกเป็นรายการ "ปรับยอด" เพื่อให้มีประวัติ
          if (newQty !== Number(edItem.qty)) {
            return fetch(SUPABASE_URL + "/rest/v1/rpc/inv_move", {
              method: "POST", headers: sbHeaders(true),
              body: JSON.stringify({ p_item: edItem.id, p_type: "adjust", p_qty: newQty, p_person: person, p_note: "แก้ยอดจากหน้าแก้ไข" }),
            });
          }
        }).then(done).catch(fail);
    }
  }
  function delItem() {
    if (!edItem || role !== "boss") return;
    if (!confirm("ลบ “" + edItem.name + "” ออกจากสต๊อก?\n(ประวัติรับ-จ่ายเดิมยังอยู่)")) return;
    fetch(SUPABASE_URL + "/rest/v1/inv_items?id=eq." + edItem.id, {
      method: "PATCH", headers: sbHeaders(true), body: JSON.stringify({ active: false }),
    }).then(function (r) {
      if (!r.ok) throw 0;
      $("editBg").hidden = true;
      toast("🗑 ลบแล้ว");
      loadAll();
    }).catch(function () { $("edErr").textContent = "ลบไม่สำเร็จ ลองใหม่อีกครั้ง"; });
  }

  // ---------- แจ้งเตือน LINE ----------
  function sendLineAlert() {
    var low = items.filter(function (it) { return statusOf(it) !== "ok"; });
    if (!low.length) { toast("👍 ไม่มีของใกล้หมด — ไม่ต้องแจ้ง"); return; }
    if (!confirm("ส่งรายการของหมด/ใกล้หมด " + low.length + " รายการ เข้ากลุ่ม LINE เลยไหม?")) return;
    if (location.protocol === "file:") { toast("⚠️ ต้องเปิดจากเว็บ (omega-pm.vercel.app) ถึงจะส่งได้"); return; }
    toast("⏳ กำลังส่ง...");
    fetch("api/stock-alert?send=1").then(function (r) { return r.json(); }).then(function (j) {
      if (j.sent) toast("✅ ส่งเข้ากลุ่ม LINE แล้ว (" + j.low + " รายการ)");
      else toast("⚠️ " + (j.error || "ส่งไม่สำเร็จ"));
    }).catch(function () { toast("⚠️ ส่งไม่สำเร็จ ลองใหม่อีกครั้ง"); });
  }

  // ---------- ผูกปุ่ม ----------
  document.querySelectorAll(".sum-box").forEach(function (b) {
    b.addEventListener("click", function () {
      var f = b.getAttribute("data-f");
      statusF = statusF === f ? "" : f;
      tab = "items"; setTab();
      render();
    });
  });
  function setTab() {
    $("tabItems").classList.toggle("active", tab === "items");
    $("tabHist").classList.toggle("active", tab === "hist");
  }
  $("tabItems").addEventListener("click", function () { tab = "items"; setTab(); render(); });
  $("tabHist").addEventListener("click", function () { tab = "hist"; setTab(); render(); });
  $("searchInput").addEventListener("input", function () { q = this.value; render(); });
  $("refreshBtn").addEventListener("click", loadAll);
  $("addBtn").addEventListener("click", function () { openEdit(null); });
  $("lineAlertBar").addEventListener("click", sendLineAlert);
  $("mvCancel").addEventListener("click", function () { $("moveBg").hidden = true; });
  $("mvOk").addEventListener("click", doMove);
  $("mvMinus").addEventListener("click", function () { $("mvQty").value = Math.max(0, (Number($("mvQty").value) || 0) - 1); });
  $("mvPlus").addEventListener("click", function () { $("mvQty").value = (Number($("mvQty").value) || 0) + 1; });
  $("edCancel").addEventListener("click", function () { $("editBg").hidden = true; });
  $("edCat").addEventListener("change", syncSnFld);
  $("edOk").addEventListener("click", saveEdit);
  $("edDel").addEventListener("click", delItem);
  $("fxCancel").addEventListener("click", function () { $("fixBg").hidden = true; });
  $("fxOk").addEventListener("click", function () { doFix(false); });
  $("fxDel").addEventListener("click", function () { doFix(true); });
  $("fxMinus").addEventListener("click", function () { $("fxQty").value = Math.max(1, (Number($("fxQty").value) || 1) - 1); });
  $("fxPlus").addEventListener("click", function () { $("fxQty").value = (Number($("fxQty").value) || 0) + 1; });
  $("logoutBtn").addEventListener("click", function () {
    if (!confirm("ออกจากระบบ?")) return;
    try { localStorage.removeItem(LOGIN_KEY); } catch (e) {}
    location.reload();
  });
  [$("moveBg"), $("editBg"), $("fixBg")].forEach(function (bg) {
    bg.addEventListener("click", function (e) { if (e.target === bg) bg.hidden = true; });
  });

  initLogin();
})();
</script>
</body>
</html>
